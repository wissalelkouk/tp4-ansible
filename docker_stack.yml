---
# Partie 4 : playbook monolithique (Jenkins, Docker, Portainer, conteneur web)
- name: Installer Jenkins, Docker, Portainer et le conteneur web
  hosts: nodes
  become: true
  gather_facts: true

  tasks:
    # ----- Jenkins -----
    - name: Installer Java et les prérequis
      ansible.builtin.apt:
        name: [openjdk-21-jre, ca-certificates, curl, gnupg]
        state: present
        update_cache: true

    - name: Créer le dossier des clés apt
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Télécharger la clé du dépôt Jenkins
      ansible.builtin.get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /etc/apt/keyrings/jenkins.asc
        force: true
        mode: '0644'

    - name: Ajouter le dépôt Jenkins
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/jenkins.asc] https://pkg.jenkins.io/debian-stable binary/"
        filename: jenkins
        state: present

    - name: Installer Jenkins
      ansible.builtin.apt:
        name: jenkins
        state: present
        update_cache: true

    - name: Démarrer et activer Jenkins
      ansible.builtin.service:
        name: jenkins
        state: started
        enabled: true

    # ----- Docker -----
    - name: Installer Docker et le plugin compose
      ansible.builtin.apt:
        name: [docker.io, docker-compose-v2, python3-docker]
        state: present

    - name: Démarrer et activer Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Ajouter l'utilisateur au groupe docker
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    # ----- Portainer -----
    - name: Créer le volume Portainer
      community.docker.docker_volume:
        name: portainer_data

    - name: Lancer Portainer
      community.docker.docker_container:
        name: portainer
        image: portainer/portainer-ce:lts
        state: started
        restart_policy: always
        ports: ["9000:9000", "9443:9443"]
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
          - portainer_data:/data

    # ----- Conteneur web -----
    - name: Créer le dossier du projet
      ansible.builtin.file:
        path: /opt/web
        state: directory
        mode: '0755'

    - name: Copier docker-compose.yml
      ansible.builtin.copy:
        content: |
          services:
            web:
              image: {{ web_image }}
              container_name: ansible-web
              ports:
                - "{{ web_port }}:80"
              restart: unless-stopped
        dest: /opt/web/docker-compose.yml
        mode: '0644'

    - name: Démarrer le conteneur web
      community.docker.docker_compose_v2:
        project_src: /opt/web
        pull: missing
        state: present

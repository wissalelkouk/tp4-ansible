---
- name: Créer le dossier du projet
  ansible.builtin.file:
    path: /opt/web
    state: directory
    mode: '0755'

- name: Copier docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/web/docker-compose.yml
    mode: '0644'

- name: Démarrer le conteneur web via docker compose
  community.docker.docker_compose_v2:
    project_src: /opt/web
    pull: missing
    state: present
